[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-threat-intelligence"
version = "0.1.0"
description = "Explainable, Imbalance-Aware and Adaptive Network Intrusion Detection System (NIDS)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "DataNova Global Data-thon Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "numpy>=2.1.0,<3.0.0",
    "pandas>=2.2.0,<3.0.0",
    "scipy>=1.14.0,<2.0.0",
    "scikit-learn>=1.6.0,<2.0.0",
    "xgboost>=3.0.0,<4.0.0",
    "imbalanced-learn>=0.13.0,<0.15.0",
    "joblib>=1.4.0,<2.0.0",
    "shap>=0.50.0,<1.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "pydantic-settings>=2.7.0,<3.0.0",
    "pyyaml>=6.0.2,<7.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
    "sqlalchemy>=2.0.35,<3.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "httpx>=0.28.0,<1.0.0",
    "python-dotenv>=1.0.1,<2.0.0"
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "backend/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.setuptools.packages.find]
where = ["."]
include = ["ml*", "backend*", "scripts*"]
